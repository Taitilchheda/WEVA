<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="gBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D6E4F7"/>
      <stop offset="100%" stop-color="#A8C4E0"/>
    </linearGradient>
    <linearGradient id="gShared" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#2E75B6"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2A4A"/>
    </marker>
  </defs>

  <text x="550" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#1B2A4A">Universal Spectral Encoder (USE) — The Modality-Agnostic Core</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#5D6D7E">All four modality frontends feed into the *same* shared wave projection. This is the architectural heart of WEVA-v2.</text>

  <!-- Modality frontends (left column) -->
  <g>
    <rect x="40" y="100" width="200" height="64" rx="8" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="140" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B2A4A">Text frontend</text>
    <text x="140" y="142" text-anchor="middle" font-size="11" fill="#1B2A4A">Embedding + position</text>
    <text x="140" y="156" text-anchor="middle" font-size="10" fill="#1B2A4A">(B, L, d)</text>
  </g>
  <g>
    <rect x="40" y="180" width="200" height="64" rx="8" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="140" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B2A4A">Image frontend</text>
    <text x="140" y="222" text-anchor="middle" font-size="11" fill="#1B2A4A">Conv2d patch projection</text>
    <text x="140" y="236" text-anchor="middle" font-size="10" fill="#1B2A4A">(B, N_patches, d)</text>
  </g>
  <g>
    <rect x="40" y="260" width="200" height="64" rx="8" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="140" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B2A4A">Audio frontend</text>
    <text x="140" y="302" text-anchor="middle" font-size="11" fill="#1B2A4A">STFT + log-mag + Linear</text>
    <text x="140" y="316" text-anchor="middle" font-size="10" fill="#1B2A4A">(B, T_spec, d)</text>
  </g>
  <g>
    <rect x="40" y="340" width="200" height="64" rx="8" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="140" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B2A4A">Video frontend</text>
    <text x="140" y="382" text-anchor="middle" font-size="11" fill="#1B2A4A">Per-frame patches + Conv1d</text>
    <text x="140" y="396" text-anchor="middle" font-size="10" fill="#1B2A4A">(B, T/2, d)</text>
  </g>

  <!-- Arrows into shared projection -->
  <g stroke="#1B2A4A" stroke-width="1.5" fill="none">
    <path d="M240 132 L300 132 L300 260 L340 260" marker-end="url(#arrow2)"/>
    <path d="M240 212 L320 212 L320 260 L340 260" marker-end="url(#arrow2)"/>
    <path d="M240 292 L320 292 L320 260 L340 260" marker-end="url(#arrow2)"/>
    <path d="M240 372 L300 372 L300 260 L340 260" marker-end="url(#arrow2)"/>
  </g>

  <!-- The big shared projection box -->
  <rect x="340" y="170" width="380" height="220" rx="12" fill="url(#gShared)"/>
  <text x="530" y="200" text-anchor="middle" font-size="17" font-weight="bold" fill="white">★ Shared Wave Projection ★</text>
  <text x="530" y="222" text-anchor="middle" font-size="12" fill="#D6E4F7">One nn.Linear(d → 2d) used by ALL modalities</text>

  <text x="380" y="262" font-size="13" fill="white" font-weight="bold">1.</text>
  <text x="400" y="262" font-size="13" fill="#D6E4F7">A = softplus(Linear_A(x))</text>
  <text x="400" y="282" font-size="11" fill="#A8C4E0">amplitude, positivity via softplus</text>

  <text x="380" y="310" font-size="13" fill="white" font-weight="bold">2.</text>
  <text x="400" y="310" font-size="13" fill="#D6E4F7">φ = Linear_φ(x)</text>
  <text x="400" y="330" font-size="11" fill="#A8C4E0">unbounded phase</text>

  <text x="380" y="358" font-size="13" fill="white" font-weight="bold">3.</text>
  <text x="400" y="358" font-size="13" fill="#D6E4F7">wave = A · exp(i φ) + proj(x)</text>
  <text x="400" y="378" font-size="11" fill="#A8C4E0">complex wave packet + real residual</text>

  <!-- Arrow out -->
  <line x1="720" y1="280" x2="780" y2="280" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Modality token prepended -->
  <rect x="780" y="200" width="240" height="160" rx="10" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="900" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A4A">+ Modality token</text>
  <text x="900" y="252" text-anchor="middle" font-size="11" fill="#1B2A4A">A learned embedding is</text>
  <text x="900" y="268" text-anchor="middle" font-size="11" fill="#1B2A4A">prepended to the wave</text>
  <text x="900" y="284" text-anchor="middle" font-size="11" fill="#1B2A4A">sequence so the SWM</text>
  <text x="900" y="300" text-anchor="middle" font-size="11" fill="#1B2A4A">backbone can disambiguate</text>
  <text x="900" y="316" text-anchor="middle" font-size="11" fill="#1B2A4A">text/image/audio/video.</text>
  <text x="900" y="340" text-anchor="middle" font-size="10" fill="#1B2A4A" font-style="italic">Indices: 0=text, 1=image,</text>
  <text x="900" y="354" text-anchor="middle" font-size="10" fill="#1B2A4A" font-style="italic">2=audio, 3=video</text>

  <!-- Bottom: equation -->
  <rect x="40" y="440" width="980" height="100" rx="8" fill="#F4F6F7" stroke="#1B2A4A" stroke-width="1"/>
  <text x="60" y="470" font-size="14" font-weight="bold" fill="#1B2A4A">Output of USE for modality m, position i:</text>
  <text x="60" y="500" font-family="Courier New, monospace" font-size="16" fill="#1B2A4A" font-weight="bold">USE(x_i) = A_i · exp(i · φ_i) + proj(x_i)   ∈ ℂ^d</text>
  <text x="60" y="528" font-size="11" fill="#5D6D7E">where A_i, φ_i, and proj(·) are produced by the *same* learned projection that all four modalities share.</text>
</svg>
