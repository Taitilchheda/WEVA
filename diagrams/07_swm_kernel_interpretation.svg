<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="gBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D6E4F7"/>
      <stop offset="100%" stop-color="#A8C4E0"/>
    </linearGradient>
    <linearGradient id="gAmp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAFAF1"/>
      <stop offset="100%" stop-color="#A9DFBF"/>
    </linearGradient>
    <linearGradient id="gPhase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9E7"/>
      <stop offset="100%" stop-color="#F7DC6F"/>
    </linearGradient>
    <linearGradient id="gOut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDEDEC"/>
      <stop offset="100%" stop-color="#F5B7B1"/>
    </linearGradient>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2A4A"/>
    </marker>
  </defs>

  <text x="550" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#1B2A4A">SWM as a Learned Convolutional Kernel in the Frequency Domain</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#5D6D7E">An FFT, a learned filter, and an IFFT is mathematically equivalent to a depthwise circular convolution in the time domain. The amp/phase split is a polar decomposition of the complex filter.</text>

  <!-- Input wave packet (time domain) -->
  <rect x="20" y="100" width="200" height="320" rx="8" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="120" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A4A">Input wave packet</text>
  <text x="120" y="148" text-anchor="middle" font-size="11" fill="#1B2A4A">z ∈ ℂ^{N×d}</text>

  <!-- Draw a small inline wave -->
  <path d="M 30 220 Q 60 200, 80 220 T 130 220 T 180 220 T 220 220" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="120" y="260" text-anchor="middle" font-size="11" fill="#1B2A4A">time-domain</text>
  <text x="120" y="280" text-anchor="middle" font-size="10" fill="#1B2A4A" font-style="italic">sequence of N complex values</text>

  <text x="120" y="320" text-anchor="middle" font-size="11" fill="#1B2A4A" font-weight="bold">≡</text>
  <text x="120" y="345" text-anchor="middle" font-size="11" fill="#1B2A4A">convolution with</text>
  <text x="120" y="365" text-anchor="middle" font-size="11" fill="#1B2A4A" font-weight="bold">a learned kernel k</text>
  <text x="120" y="390" text-anchor="middle" font-size="11" fill="#1B2A4A" font-style="italic">(by convolution theorem)</text>

  <!-- FFT arrow -->
  <line x1="220" y1="260" x2="270" y2="260" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="245" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B2A4A">FFT</text>

  <!-- Frequency domain -->
  <rect x="270" y="100" width="200" height="320" rx="8" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="370" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A4A">Frequency spectrum</text>
  <text x="370" y="148" text-anchor="middle" font-size="11" fill="#1B2A4A">ẑ ∈ ℂ^{N×d}</text>

  <!-- amplitude spectrum -->
  <rect x="290" y="170" width="160" height="100" rx="4" fill="url(#gAmp)" stroke="#1A7A4A" stroke-width="1.5"/>
  <text x="370" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A7A4A">Amplitude |ẑ|</text>
  <text x="370" y="215" text-anchor="middle" font-size="10" fill="#1A7A4A">energy per frequency bin</text>
  <!-- bar plot of amp -->
  <g fill="#1A7A4A">
    <rect x="300" y="240" width="6" height="20"/>
    <rect x="310" y="232" width="6" height="28"/>
    <rect x="320" y="222" width="6" height="38"/>
    <rect x="330" y="244" width="6" height="16"/>
    <rect x="340" y="248" width="6" height="12"/>
    <rect x="350" y="252" width="6" height="8"/>
    <rect x="360" y="254" width="6" height="6"/>
    <rect x="370" y="256" width="6" height="4"/>
    <rect x="380" y="257" width="6" height="3"/>
    <rect x="390" y="258" width="6" height="2"/>
    <rect x="400" y="258" width="6" height="2"/>
    <rect x="410" y="259" width="6" height="1"/>
    <rect x="420" y="259" width="6" height="1"/>
    <rect x="430" y="260" width="6" height="1"/>
  </g>

  <!-- phase spectrum -->
  <rect x="290" y="290" width="160" height="100" rx="4" fill="url(#gPhase)" stroke="#7D6608" stroke-width="1.5"/>
  <text x="370" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#7D6608">Phase ∠ẑ</text>
  <text x="370" y="335" text-anchor="middle" font-size="10" fill="#7D6608">temporal offset per bin</text>
  <!-- polar -->
  <g stroke="#7D6608" fill="none" stroke-width="1.5">
    <circle cx="370" cy="370" r="14"/>
    <line x1="370" y1="370" x2="382" y2="362"/>
  </g>
  <text x="370" y="395" text-anchor="middle" font-size="9" fill="#7D6608">arg(ẑ_k) for each k</text>

  <!-- arrow to learned filter -->
  <line x1="470" y1="260" x2="520" y2="260" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="495" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B2A4A">× W_amp, + W_phase</text>

  <!-- Learned filter -->
  <rect x="520" y="100" width="280" height="320" rx="8" fill="#1B2A4A"/>
  <text x="660" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="white">★ Learned spectral filter</text>
  <text x="660" y="150" text-anchor="middle" font-size="11" fill="#D6E4F7">polar decomposition into two real matrices</text>

  <rect x="540" y="170" width="240" height="80" rx="4" fill="url(#gAmp)" stroke="#1A7A4A" stroke-width="2"/>
  <text x="660" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A7A4A">W_amp ∈ ℝ^{d×d}</text>
  <text x="660" y="215" text-anchor="middle" font-size="11" fill="#1A7A4A">|ẑ| · W_amp + b_freq</text>
  <text x="660" y="232" text-anchor="middle" font-size="10" fill="#1A7A4A" font-style="italic">reallocates energy across frequencies</text>

  <rect x="540" y="270" width="240" height="80" rx="4" fill="url(#gPhase)" stroke="#7D6608" stroke-width="2"/>
  <text x="660" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#7D6608">W_phase ∈ ℝ^{d×d}</text>
  <text x="660" y="315" text-anchor="middle" font-size="11" fill="#7D6608">∠ẑ · W_phase</text>
  <text x="660" y="332" text-anchor="middle" font-size="10" fill="#7D6608" font-style="italic">shifts phase per frequency bin (time-shift)</text>

  <text x="660" y="380" text-anchor="middle" font-size="11" fill="#D6E4F7">reconstruct ẑ' = |ẑ'|·exp(i·∠ẑ')</text>
  <text x="660" y="400" text-anchor="middle" font-size="11" fill="#D6E4F7">IFFT to get z' in time domain</text>

  <!-- arrow to output -->
  <line x1="800" y1="260" x2="850" y2="260" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="825" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B2A4A">IFFT</text>

  <!-- Output -->
  <rect x="850" y="100" width="220" height="320" rx="8" fill="url(#gOut)" stroke="#922B21" stroke-width="1.5"/>
  <text x="960" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#922B21">Output wave packet</text>
  <text x="960" y="148" text-anchor="middle" font-size="11" fill="#922B21">z' = IFFT(ẑ') + z</text>
  <path d="M 870 220 Q 900 200, 920 220 T 970 220 T 1020 220 T 1060 220" fill="none" stroke="#922B21" stroke-width="2"/>
  <text x="960" y="260" text-anchor="middle" font-size="11" fill="#922B21">time-domain, residual added</text>

  <text x="960" y="300" text-anchor="middle" font-size="11" fill="#922B21" font-weight="bold">★ Convolution-theorem interpretation:</text>
  <text x="960" y="320" text-anchor="middle" font-size="11" fill="#922B21">z' = k * z (circular)</text>
  <text x="960" y="345" text-anchor="middle" font-size="11" fill="#922B21">where k = IFFT(W_amp · exp(i·W_phase))</text>
  <text x="960" y="370" text-anchor="middle" font-size="11" fill="#922B21" font-style="italic">The "kernel" k is a length-N circular</text>
  <text x="960" y="386" text-anchor="middle" font-size="11" fill="#922B21" font-style="italic">convolution filter whose frequency</text>
  <text x="960" y="402" text-anchor="middle" font-size="11" fill="#922B21" font-style="italic">response is exactly W_amp + i·W_phase.</text>

  <!-- Bottom callout -->
  <rect x="20" y="450" width="1050" height="130" rx="8" fill="#F4F6F7" stroke="#1B2A4A" stroke-width="1"/>
  <text x="40" y="478" font-size="14" font-weight="bold" fill="#1B2A4A">Why the polar decomposition is novel:</text>
  <text x="40" y="504" font-size="12" fill="#1B2A4A">A standard complex filter is one matrix W ∈ ℂ^{d×d}: it has 2d² learnable scalars. We split it into two real matrices</text>
  <text x="40" y="522" font-size="12" fill="#1B2A4A">W_amp, W_phase ∈ ℝ^{d×d}: also 2d² scalars, but the optimiser treats amplitude modulation and phase modulation as</text>
  <text x="40" y="540" font-size="12" fill="#1B2A4A">two independent operations. The ablation in §6.3 shows this gives +1.8 R@1 over the coupled form.</text>
  <text x="40" y="565" font-size="11" fill="#5D6D7E" font-style="italic">Geometrically: W_amp controls the energy envelope, W_phase controls the time-shift — the two operations</text>
  <text x="40" y="582" font-size="11" fill="#5D6D7E" font-style="italic">are not interchangeable. A polar decomposition is the natural parameterisation for a learned filter on a complex spectrum.</text>
</svg>
