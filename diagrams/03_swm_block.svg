<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="gBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D6E4F7"/>
      <stop offset="100%" stop-color="#A8C4E0"/>
    </linearGradient>
    <linearGradient id="gAmp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAFAF1"/>
      <stop offset="100%" stop-color="#A9DFBF"/>
    </linearGradient>
    <linearGradient id="gPhase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9E7"/>
      <stop offset="100%" stop-color="#F7DC6F"/>
    </linearGradient>
    <linearGradient id="gMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#2E75B6"/>
    </linearGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2A4A"/>
    </marker>
  </defs>

  <text x="550" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#1B2A4A">Spectral Wave Mixer (SWM) — The Attention Replacement</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#5D6D7E">Replaces dot-product QK attention with a learned frequency-domain filter that separately transforms amplitude and phase.</text>

  <!-- Input -->
  <rect x="40" y="120" width="180" height="64" rx="8" fill="url(#gMain)"/>
  <text x="130" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Input z ∈ ℂ^{N×d}</text>
  <text x="130" y="166" text-anchor="middle" font-size="11" fill="#D6E4F7">complex wave packet</text>

  <line x1="220" y1="152" x2="280" y2="152" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- FFT -->
  <rect x="280" y="120" width="180" height="64" rx="8" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="370" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A4A">FFT (dim=seq)</text>
  <text x="370" y="166" text-anchor="middle" font-size="11" fill="#1B2A4A">z_freq ∈ ℂ^{N×d}</text>

  <line x1="460" y1="152" x2="510" y2="152" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Decompose -->
  <rect x="510" y="80" width="180" height="60" rx="8" fill="url(#gAmp)" stroke="#1A7A4A" stroke-width="1.5"/>
  <text x="600" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A7A4A">Amplitude</text>
  <text x="600" y="124" text-anchor="middle" font-size="11" fill="#1A7A4A">A = |z_freq|</text>
  <line x1="690" y1="110" x2="730" y2="110" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="510" y="200" width="180" height="60" rx="8" fill="url(#gPhase)" stroke="#7D6608" stroke-width="1.5"/>
  <text x="600" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#7D6608">Phase</text>
  <text x="600" y="244" text-anchor="middle" font-size="11" fill="#7D6608">φ = angle(z_freq)</text>
  <line x1="690" y1="230" x2="730" y2="230" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- W_amp and W_phase -->
  <rect x="730" y="80" width="180" height="60" rx="8" fill="url(#gAmp)" stroke="#1A7A4A" stroke-width="2"/>
  <text x="820" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A7A4A">A · W_amp + b_freq</text>
  <text x="820" y="124" text-anchor="middle" font-size="11" fill="#1A7A4A">learned d×d matrix</text>

  <rect x="730" y="200" width="180" height="60" rx="8" fill="url(#gPhase)" stroke="#7D6608" stroke-width="2"/>
  <text x="820" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#7D6608">φ · W_phase</text>
  <text x="820" y="244" text-anchor="middle" font-size="11" fill="#7D6608">learned d×d matrix</text>

  <!-- Combine -->
  <line x1="910" y1="110" x2="950" y2="170" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="910" y1="230" x2="950" y2="190" stroke="#1B2A4A" stroke-width="2"/>

  <rect x="950" y="160" width="120" height="60" rx="8" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="1010" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B2A4A">A' · exp(i φ')</text>
  <text x="1010" y="204" text-anchor="middle" font-size="11" fill="#1B2A4A">complex spectrum</text>

  <line x1="1010" y1="220" x2="1010" y2="280" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="950" y="280" width="120" height="50" rx="8" fill="url(#gBox)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="1010" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B2A4A">IFFT</text>
  <text x="1010" y="316" text-anchor="middle" font-size="11" fill="#1B2A4A">z_out ∈ ℝ^{N×d}</text>

  <line x1="950" y1="305" x2="280" y2="305" stroke="#1B2A4A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="615" y="298" font-size="11" font-style="italic" fill="#5D6D7E">(residual to input z)</text>

  <!-- Equation block -->
  <rect x="40" y="380" width="1020" height="160" rx="8" fill="#F4F6F7" stroke="#1B2A4A" stroke-width="1"/>
  <text x="60" y="408" font-size="14" font-weight="bold" fill="#1B2A4A">Mathematical formulation (single head):</text>
  <text x="60" y="438" font-family="Courier New, monospace" font-size="14" fill="#1B2A4A" font-weight="bold">z_freq = FFT(z, dim=seq)</text>
  <text x="60" y="460" font-family="Courier New, monospace" font-size="14" fill="#1B2A4A" font-weight="bold">A' = |z_freq| · W_amp + b_freq</text>
  <text x="60" y="482" font-family="Courier New, monospace" font-size="14" fill="#1B2A4A" font-weight="bold">φ' = angle(z_freq) · W_phase</text>
  <text x="60" y="504" font-family="Courier New, monospace" font-size="14" fill="#1B2A4A" font-weight="bold">z_out = IFFT(A' · exp(i φ'), dim=seq) + z</text>

  <text x="60" y="530" font-size="11" fill="#5D6D7E">Multi-head: H independent SWMs over d/H-dimensional subspaces, then concat + linear project.</text>

  <!-- Comparison table -->
  <rect x="40" y="560" width="1020" height="180" rx="8" fill="white" stroke="#1B2A4A" stroke-width="1"/>
  <text x="60" y="586" font-size="14" font-weight="bold" fill="#1B2A4A">Comparison vs prior frequency-domain mixers:</text>
  <text x="60" y="612" font-size="12" font-weight="bold" fill="#1B2A4A">FNet (2022):</text>
  <text x="180" y="612" font-size="12" fill="#1B2A4A">unparameterized DFT — no learned amplitude/phase separation.</text>
  <text x="60" y="632" font-size="12" font-weight="bold" fill="#1B2A4A">GFNet (2021):</text>
  <text x="180" y="632" font-size="12" fill="#1B2A4A">one learned global filter — does not separate amplitude from phase.</text>
  <text x="60" y="652" font-size="12" font-weight="bold" fill="#1B2A4A">AFNO (2022):</text>
  <text x="180" y="652" font-size="12" fill="#1B2A4A">block-diagonal frequency weighting — limited expressivity.</text>
  <text x="60" y="672" font-size="12" font-weight="bold" fill="#1B2A4A">Wave-PDE Nets (2025):</text>
  <text x="180" y="672" font-size="12" fill="#1B2A4A">simulates a wave PDE — heavier and harder to scale.</text>
  <text x="60" y="692" font-size="12" font-weight="bold" fill="#1B2A4A">★ WEVA SWM:</text>
  <text x="180" y="692" font-size="12" fill="#1A7A4A" font-weight="bold">separate learned amplitude + phase matrices on a shared backbone.</text>
  <text x="60" y="718" font-size="11" fill="#5D6D7E" font-style="italic">★ The phase matrix is the load-bearing addition — attention has no analog of phase shifting.</text>
</svg>
