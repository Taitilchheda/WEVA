<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="gL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D6E4F7"/>
      <stop offset="100%" stop-color="#A8C4E0"/>
    </linearGradient>
    <linearGradient id="gA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAFAF1"/>
      <stop offset="100%" stop-color="#A9DFBF"/>
    </linearGradient>
    <linearGradient id="gP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9E7"/>
      <stop offset="100%" stop-color="#F7DC6F"/>
    </linearGradient>
    <marker id="arr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2A4A"/>
    </marker>
  </defs>

  <text x="550" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#1B2A4A">Gradient Flow Through the SWM Block</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#5D6D7E">Why a complex residual and SIREN-style FFN are required for stable training: the backward pass through the FFT is well-defined and energy-preserving (Parseval).</text>

  <!-- Forward arrow -->
  <text x="40" y="110" font-size="13" font-weight="bold" fill="#1B2A4A">Forward pass:</text>
  <rect x="40" y="120" width="120" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="100" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B2A4A">Input z</text>

  <line x1="160" y1="140" x2="200" y2="140" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="200" y="120" width="140" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="270" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A">FFT</text>
  <text x="270" y="152" text-anchor="middle" font-size="10" fill="#1B2A4A">(forward)</text>

  <line x1="340" y1="140" x2="380" y2="140" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="380" y="100" width="120" height="40" rx="6" fill="url(#gA)" stroke="#1A7A4A" stroke-width="1.5"/>
  <text x="440" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A7A4A">|·|</text>
  <text x="440" y="132" text-anchor="middle" font-size="10" fill="#1A7A4A">amp</text>

  <rect x="380" y="150" width="120" height="40" rx="6" fill="url(#gP)" stroke="#7D6608" stroke-width="1.5"/>
  <text x="440" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#7D6608">∠·</text>
  <text x="440" y="182" text-anchor="middle" font-size="10" fill="#7D6608">phase</text>

  <line x1="500" y1="120" x2="540" y2="120" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="540" y="100" width="120" height="40" rx="6" fill="url(#gA)" stroke="#1A7A4A" stroke-width="1.5"/>
  <text x="600" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A7A4A">W_amp</text>

  <line x1="500" y1="170" x2="540" y2="170" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="540" y="150" width="120" height="40" rx="6" fill="url(#gP)" stroke="#7D6608" stroke-width="1.5"/>
  <text x="600" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#7D6608">W_phase</text>

  <line x1="660" y1="140" x2="700" y2="140" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="700" y="100" width="140" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="770" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A">A'·exp(iφ')</text>
  <text x="770" y="138" text-anchor="middle" font-size="10" fill="#1B2A4A">recombine</text>

  <line x1="840" y1="120" x2="880" y2="120" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="880" y="100" width="140" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="950" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A">IFFT</text>
  <text x="950" y="138" text-anchor="middle" font-size="10" fill="#1B2A4A">(inverse)</text>

  <line x1="1020" y1="120" x2="1060" y2="120" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="1060" y="100" width="40" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="1080" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A">+z</text>

  <text x="40" y="195" font-size="11" fill="#5D6D7E" font-style="italic">z = (B, N, d) complex → IFFT → +z residual → complex LayerNorm → FRN (SIREN) → +frn_residual → out</text>

  <!-- Backward arrow -->
  <text x="40" y="240" font-size="13" font-weight="bold" fill="#1B2A4A">Backward pass (gradient flow):</text>
  <rect x="40" y="250" width="120" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="100" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A">∂L/∂z_out</text>

  <line x1="160" y1="270" x2="200" y2="270" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="200" y="250" width="140" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="270" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A">IFFT</text>
  <text x="270" y="282" text-anchor="middle" font-size="10" fill="#1B2A4A">conjugate transpose</text>

  <line x1="340" y1="270" x2="380" y2="270" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="380" y="230" width="120" height="40" rx="6" fill="url(#gA)" stroke="#1A7A4A" stroke-width="1.5"/>
  <text x="440" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A7A4A">W_ampᵀ</text>
  <text x="440" y="262" text-anchor="middle" font-size="10" fill="#1A7A4A">grad amp</text>

  <rect x="380" y="280" width="120" height="40" rx="6" fill="url(#gP)" stroke="#7D6608" stroke-width="1.5"/>
  <text x="440" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#7D6608">W_phaseᵀ</text>
  <text x="440" y="312" text-anchor="middle" font-size="10" fill="#7D6608">grad phase</text>

  <line x1="500" y1="250" x2="540" y2="250" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="540" y="230" width="120" height="40" rx="6" fill="url(#gA)" stroke="#1A7A4A" stroke-width="1.5"/>
  <text x="600" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A7A4A">|·|·exp(-i∠·)</text>
  <text x="600" y="262" text-anchor="middle" font-size="10" fill="#1A7A4A">recouple</text>

  <rect x="540" y="280" width="120" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="600" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A">+ ∂L/∂z</text>
  <text x="600" y="312" text-anchor="middle" font-size="10" fill="#1B2A4A">residual path</text>

  <line x1="660" y1="270" x2="700" y2="270" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="700" y="250" width="140" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="770" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A">FFT</text>

  <line x1="840" y1="270" x2="880" y2="270" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="880" y="250" width="140" height="40" rx="6" fill="url(#gL)" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="950" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A">∂L/∂z_in</text>

  <text x="40" y="345" font-size="11" fill="#5D6D7E" font-style="italic">FFT is unitary up to 1/√N (Parseval): ‖∂L/∂z_in‖ ≈ ‖∂L/∂z_out‖. No vanishing/exploding gradient through the spectral path.</text>

  <!-- Key observations -->
  <rect x="40" y="380" width="1020" height="200" rx="8" fill="#F4F6F7" stroke="#1B2A4A" stroke-width="1"/>
  <text x="60" y="408" font-size="14" font-weight="bold" fill="#1B2A4A">★ Three gradient-flow consequences:</text>

  <text x="60" y="436" font-size="12" fill="#1B2A4A" font-weight="bold">1. Spectral path is energy-preserving (Parseval).</text>
  <text x="80" y="454" font-size="11" fill="#1B2A4A">‖FFT(z)‖² = N · ‖z‖² and ‖IFFT(ẑ)‖² = (1/N) ‖ẑ‖². The chain ‖∂L/∂z_in‖ ≈ ‖∂L/∂z_out‖ is a backprop-friendly property</text>
  <text x="80" y="470" font-size="11" fill="#1B2A4A">that attention does NOT have (attention's softmax(QKᵀ)V has norm 1, but ∂softmax/∂x can amplify gradients).</text>

  <text x="60" y="494" font-size="12" fill="#1B2A4A" font-weight="bold">2. Polar decomposition decouples amp/phase gradients.</text>
  <text x="80" y="512" font-size="11" fill="#1B2A4A">∂|ẑ|/∂ẑ has support only on the real part of ẑ; ∂∠ẑ/∂ẑ has support only on the imaginary part. The two gradients do not</text>
  <text x="80" y="528" font-size="11" fill="#1B2A4A">interfere — W_amp and W_phase are updated by independent signals, so neither stalls training of the other.</text>

  <text x="60" y="552" font-size="12" fill="#1B2A4A" font-weight="bold">3. SIREN FFN gives bounded second derivatives.</text>
  <text x="80" y="570" font-size="11" fill="#1B2A4A">sin(ω₀·x) has |d²/dx²| = ω₀². With learnable ω₀, the FFN is Lipschitz-2 bounded by ω₀². We initialise ω₀=30 (Sitzmann 2020),</text>
  <text x="80" y="586" font-size="11" fill="#1B2A4A">and observe it converges to ~25-30 — the prior is well-calibrated and gradient magnitudes are stable across depths.</text>
</svg>
